<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="データカウンター 期待度 9999% 確変継続中"><title>データカウンター 期待度 9999% 確変継続中</title><style>text{font-family:'Arial Black','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;font-weight:900}.pop{font-family:'HGP創英角ﾎﾟｯﾌﾟ体','HG創英角ﾎﾟｯﾌﾟ体','HGP創英角ポップ体','Arial Black','Hiragino Sans',sans-serif}.brush{font-family:'HGP行書体','HG行書体','HGS行書体','YuMincho','Hiragino Mincho ProN','Noto Serif JP',serif}.c{transform-box:fill-box;transform-origin:center}.ink{paint-order:stroke;stroke:#1A0638;stroke-linejoin:round}@keyframes hue{0%,100%{fill:#FF2E88}25%{fill:#FFE600}50%{fill:#00E5FF}75%{fill:#7CFF4F}}@keyframes rb{0%,100%{stop-color:#FF2E88}20%{stop-color:#FFE600}40%{stop-color:#7CFF4F}60%{stop-color:#00E5FF}80%{stop-color:#B04DFF}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.15}}@keyframes jump{from{transform:translateY(8px) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}@keyframes wig{from{transform:rotate(-3deg) scale(.96)}to{transform:rotate(3deg) scale(1.04)}}@keyframes pulse{from{transform:scale(.85)}to{transform:scale(1.2)}}@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,-2px)}}@keyframes pop{0%{transform:translateY(0) scale(.5);opacity:0}15%{transform:translateY(-10px) scale(1.3);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}@keyframes flash{0%,100%{opacity:0}10%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes ants{to{stroke-dashoffset:-60}}.bar{transform-box:fill-box;transform-origin:0 50%}@keyframes pump{from{transform:scaleX(.82)}to{transform:scaleX(1.04)}}@keyframes odo{to{transform:translateY(-440px)}}</style><defs><linearGradient id="rd"><stop offset="0.0" stop-color="#FF2E88" style="animation:rb 0.6s linear 0.00s infinite"/><stop offset="0.25" stop-color="#FFE600" style="animati